<!DOCTYPE html>
<html lang="nl">
<head>
<script>/*SC_OWNER*/</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interne Prijslijst 2027 · Shortclips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --org:#1a55e8; --org-soft:#e8eefd;
  --adv:#14309a; --adv-soft:#e7eaf6;
  --comp:#06053a; --comp-soft:#e6e6ee;
  --navy:#06053a;
  --faq:#d97706; --faq-soft:#fef3e2;
  --ok:#16a34a; --no:#dc2626; --warn:#b45309; --warn-soft:#fff7e6;
  --bg:#f4f5f9; --card:#fff; --line:#e4e6ee; --text:#0e1030; --muted:#6b6f86;
  --radius:14px; --shadow:0 1px 2px rgba(6,5,58,.05),0 4px 16px rgba(6,5,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}

/* ---------- layout: één pagina binnen het dashboard ---------- */
.pl-page{max-width:1240px;margin:0 auto;padding:28px 28px 60px}
.pl-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pl-head h1{margin:0}
.pl-head .meta{color:var(--muted);font-size:13px;margin-top:2px}
.pl-head .tools{margin-left:auto;display:flex;gap:10px;align-items:center}
.tabs-wrap{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 12px;margin-bottom:10px}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--text);background:var(--bg)}
.tabs button.on{background:var(--navy);color:#fff}
.tabs .sep{width:1px;background:var(--line);margin:6px 6px;flex:none}
.tabs .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tabs button.on .dot{box-shadow:0 0 0 2px #fff}
.ctrl-btn{border:1px solid #f3d29a;background:var(--warn-soft);color:#7a4a06;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.ctrl-btn .n{background:#f59e0b;color:#fff;border-radius:20px;padding:0 7px;font-size:11px;font-weight:600}
.search{position:relative;width:min(340px,100%)}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px 9px 36px;outline:none}
.search input:focus{border-color:var(--org);box-shadow:0 0 0 3px var(--org-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
.results{position:absolute;top:calc(100% + 6px);right:0;width:min(440px,92vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(6,5,58,.14);max-height:420px;overflow:auto;display:none;padding:6px;z-index:40}
.results.show{display:block}
.res{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer}
.res:hover,.res.act{background:var(--bg)}
.res .t{font-weight:500;font-size:13px}
.res .s{font-size:11.5px;color:var(--muted)}
.res .p{margin-left:auto;font-weight:600;font-size:13px;white-space:nowrap}
.res .dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.intern{font-size:11px;font-weight:600;background:var(--navy);color:#fff;border-radius:20px;padding:3px 10px;white-space:nowrap}

h1{font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.4px}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.2px}
h3{font-size:15px;margin:0 0 6px}
.lead{color:var(--muted);max-width:720px;margin:0 0 22px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted);margin-bottom:6px}
.section{margin-top:30px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.right{margin-left:auto}

.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:8px 14px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:#c9ccda}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{opacity:.9}
.btn.ghost-w{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.btn.ghost-w:hover{background:rgba(255,255,255,.2)}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500;background:var(--bg);border:1px solid var(--line)}
.chip.w{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.tag-adv{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:20px;padding:2px 9px;background:#fff;color:var(--navy)}

/* segmented */
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(6,5,58,.12)}

/* department hero cards */
.dept{border-radius:18px;padding:24px;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;min-height:300px;text-decoration:none}
.dept:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(6,5,58,.22)}
.dept .num{font-size:13px;opacity:.7;font-weight:500}
.dept h2{font-size:24px;line-height:1.1;margin:6px 0 10px;color:#fff}
.dept p{opacity:.85;margin:0 0 16px;font-size:13.5px}
.dept .prices{margin-top:auto;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
.dept .pr{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.dept .pr b{font-size:17px}
.dept .foot{font-size:11.5px;opacity:.7;margin-top:6px}
.bg-org{background:var(--org)} .bg-adv{background:var(--adv)} .bg-comp{background:var(--comp)}
.c-org{color:var(--org)} .c-adv{color:var(--adv)} .c-comp{color:var(--comp)}

.hero{background:var(--navy);color:#fff;border-radius:20px;padding:34px 34px 30px;position:relative;overflow:hidden}
.hero h1{font-size:34px;color:#fff;max-width:640px}
.hero p{opacity:.75;max-width:600px;margin:6px 0 0}
.hero .tri{position:absolute;right:-40px;top:-40px;opacity:.08}

/* package cards */
.pkg{border-radius:16px;border:2px solid var(--line);background:#fff;padding:20px;position:relative;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.pkg:hover{box-shadow:var(--shadow)}
.pkg.sel{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.pkg .nm{font-weight:600;font-size:15px}
.pkg .price{font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1.1;margin:8px 0 2px;color:var(--acc)}
.pkg .per{font-size:12.5px;color:var(--muted)}
.pkg .startbox{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px;margin:14px 0 12px;font-size:12.5px}
.pkg .startbox b{font-size:15px}
.pkg .advies{position:absolute;top:16px;right:16px;background:var(--acc);color:#fff;font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px}
.pkg .vol{display:flex;gap:6px;flex-wrap:wrap}
.vol .chip{background:var(--acc-soft);border-color:transparent;color:var(--acc);font-weight:600}

.diffbar{border-radius:12px;padding:12px 16px;background:var(--acc-soft);color:var(--acc);font-weight:500;display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:14px}
.diffbar b{font-weight:700}

/* tables */
table{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:left;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c,.tbl th.c{text-align:center}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.tbl .sub{background:var(--bg);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tbl tr.diff td{background:#fffbea}
.tbl tr.hl td{background:var(--acc-soft)}
.ico{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;flex:none}
.ico.y{background:#dcfce7;color:var(--ok)} .ico.n{background:#fee2e2;color:var(--no)} .ico.q{background:#eef0f5;color:var(--muted);font-size:11px;font-weight:700}
.li{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.li .ico{margin-top:1px}

/* info blocks */
.info{border-radius:12px;background:var(--bg);padding:14px 16px}
.info .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.info .v{font-weight:600;font-size:15px;margin:2px 0}
.info .d{font-size:12.5px;color:var(--muted)}
.check{border:1px solid #f3d29a;background:var(--warn-soft);color:#7a4a06;border-radius:10px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.check b{color:#7a4a06}
.check-ico{flex:none;width:18px;height:18px;border-radius:50%;background:#f59e0b;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}

/* flow */
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.flow .st{flex:1;min-width:150px;border-radius:12px;padding:12px 14px;background:var(--bg)}
.flow .st.on{background:var(--acc);color:#fff}
.flow .st .k{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.flow .ar{display:flex;align-items:center;color:var(--muted);font-size:18px}

/* formula */
.formula{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fbox{border-radius:14px;padding:14px 20px;text-align:center;min-width:120px;background:var(--acc-soft);color:var(--acc)}
.fbox b{display:block;font-size:34px;line-height:1.1;font-weight:700}
.fbox span{font-size:12px;font-weight:500}
.fbox.res{background:var(--acc);color:#fff}
.fop{font-size:26px;font-weight:600;color:var(--muted)}

/* accordions */
.acc{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;overflow:hidden}
.acc>button{width:100%;text-align:left;border:0;background:transparent;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:500}
.acc>button .chev{margin-left:auto;transition:transform .2s;opacity:.5}
.acc.open>button .chev{transform:rotate(180deg)}
.acc .body{display:none;padding:0 16px 16px 16px;color:#33364f}
.acc.open .body{display:block}
.qmark{width:26px;height:26px;border-radius:8px;background:var(--faq-soft);color:var(--faq);font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.faq-q{color:var(--text)}
.acc.faq.open{border-color:#f5c98a}

/* extras */
.xcat{border-top:4px solid var(--navy)}
.xrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.xrow:last-child{border-bottom:0}
.xrow .t{font-weight:500}
.xrow .s{font-size:12px;color:var(--muted)}
.xrow .p{margin-left:auto;font-weight:700;font-size:16px;white-space:nowrap}
.xdetail{display:none;background:var(--bg);border-radius:10px;padding:12px 14px;margin:0 0 10px;font-size:13px}
.xdetail.open{display:block}
.xdetail dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.xdetail dd{margin:0}

/* calculator */
.calc-lines .ln{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.calc-lines .ln span:last-child{white-space:nowrap;font-weight:500}
.calc-lines .ln.tot{border-bottom:0;border-top:2px solid var(--text);margin-top:6px;padding-top:12px;font-size:16px;font-weight:700}
.calc-lines .ln.tot span:last-child{font-weight:700}
.calc-lines .ln.grp{border-bottom:0;padding:14px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.stepper button{border:0;background:var(--bg);width:28px;height:28px;font-weight:600}
.stepper input{width:46px;border:0;text-align:center;height:28px;outline:none}
.xsel{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.xsel:last-child{border-bottom:0}
.xsel .t{font-size:13px;font-weight:500}
.xsel .s{font-size:11.5px;color:var(--muted)}
.xsel .rt{margin-left:auto;display:flex;align-items:center;gap:10px}
.xsel .pr{font-size:12px;color:var(--muted);white-space:nowrap;min-width:70px;text-align:right}
.big-total{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.05}
select,input[type=text],textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 11px;outline:none}
select:focus,input[type=text]:focus,textarea:focus{border-color:var(--org)}
label.fl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 6px}

/* wizard */
.qcard{border-radius:16px;background:#fff;border:1px solid var(--line);padding:24px;box-shadow:var(--shadow)}
.qnum{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;background:#fff}
.opt:hover{border-color:#c9ccda}
.opt.on{border-color:var(--navy);background:#f6f6fb}
.opt b{display:block;margin-bottom:2px}
.opt span{font-size:12.5px;color:var(--muted)}
.prog{display:flex;gap:6px;margin-bottom:16px}
.prog i{height:5px;flex:1;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--navy)}
.result{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:#fff}
.result .head{padding:24px;color:#fff}
.result .body{padding:22px 24px}

/* situations */
.sit{border-left:4px solid var(--acc);cursor:pointer}
.sit:hover{box-shadow:0 8px 24px rgba(6,5,58,.1)}

.copybox{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13px;max-height:420px;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:all .2s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.cmp-head{border-radius:12px;padding:14px;color:#fff}
.cmp-head .p{font-size:26px;font-weight:700;letter-spacing:-.5px}
.delta{font-weight:700}
.delta.up{color:var(--no)} .delta.down{color:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .g2,.g3{grid-template-columns:1fr}
  .pl-page{padding:18px 14px 40px}
  .pl-head .tools{margin-left:0;width:100%}
  .search{flex:1}
  .hero h1{font-size:26px}
}
@media (max-width:560px){.g4{grid-template-columns:1fr}.intern{display:none}}
.kern{font-size:15px;color:var(--muted);margin:0 0 16px}
.kern b{color:var(--text);font-size:17px;display:block;margin-bottom:2px}
.dept{min-height:250px}
.dept .more{font-size:12.5px;font-weight:600;margin-top:12px;opacity:.85}
.chip.mini{font-size:10.5px;padding:1px 7px}
.tbl.clickable tbody tr{cursor:pointer}
.tbl.clickable tbody tr:hover td{background:var(--bg)}
.dhead{display:flex;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.dhead h1{font-size:26px;margin:2px 0 4px}
.dhead .fit{margin-top:10px;font-size:13px;background:var(--acc-soft,#eef0f5);color:var(--acc);display:inline-block;border-radius:8px;padding:5px 10px}
.dhead .fit b{font-weight:600}
.pkg .price .per{font-size:13px;font-weight:400;letter-spacing:0}
.pkg .vol .chip{background:var(--acc-soft);border-color:transparent;color:var(--acc);font-weight:600}
.formula.small-f{margin-top:14px}
.formula.small-f .fbox{padding:8px 14px;min-width:80px}
.formula.small-f .fbox b{font-size:22px}
.tabs button.prim{color:var(--navy);font-weight:600}
.tabs button.prim.on{color:#fff}
.adv-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
.adv-out{position:sticky;top:78px}
.step{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.sn{width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.step.done .sn{background:var(--navy);color:#fff;border-color:var(--navy)}
.st-t{font-weight:600;margin:3px 0 10px}
.q{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0;flex-wrap:wrap}
.q span{font-size:13.5px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;padding:6px 0 0;margin-top:4px}
.bigopt{border:2px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.bigopt.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.bigopt .pp{font-size:22px;font-weight:700;color:var(--acc);letter-spacing:-.4px}
.chip.pick{cursor:pointer;background:#fff}
.chip.pick:hover{border-color:var(--navy)}
.empty{border-style:dashed;box-shadow:none}
.cmp-head .p{font-size:26px;font-weight:700;letter-spacing:-.5px}
@media (max-width:900px){.adv-grid{grid-template-columns:1fr}.adv-out{position:static}}
/* afdelingskleuren op de losse pagina's */
.pkg{padding:0;overflow:hidden;border-color:var(--acc)}
.pkg .pkg-top{background:var(--acc);color:#fff;padding:18px 20px;position:relative}
.pkg .pkg-top .nm{font-weight:600;font-size:15px;opacity:.9}
.pkg .pkg-top .price{color:#fff;margin:6px 0 0}
.pkg .pkg-top .per{color:rgba(255,255,255,.75)}
.pkg .pkg-top .advies{background:#fff;color:var(--acc)}
.pkg .pkg-body{padding:16px 20px 18px}
.pkg:not(.sel){opacity:.92}
.pkg:not(.sel) .pkg-top{filter:saturate(.85)}
.pkg.sel{box-shadow:0 0 0 4px var(--acc-soft),0 10px 26px rgba(6,5,58,.14);opacity:1}
.pkg .selmark{margin-top:10px;font-size:12px;font-weight:600;color:var(--acc)}
.dhead.filled{background:var(--acc);color:#fff;border:0}
.dhead.filled .eyebrow{color:rgba(255,255,255,.65)}
.dhead.filled h1{color:#fff}
.dhead.filled .muted{color:rgba(255,255,255,.8)}
.dhead.filled .fit{background:rgba(255,255,255,.14);color:#fff}
.diffbar{background:var(--acc);color:#fff}
.diffbar b{color:#fff}

  if(c.pkg==='creator'){
    lines.push(['Creator Partner',`${eur(CREATOR.partner.prijs)} x 6 maanden`, CREATOR.partner.prijs*6]);
    lines.push(['Opstart, eenmalig','', CREATOR.partner.opstart]);
    contract = CREATOR.partner.prijs*6 + CREATOR.partner.opstart;
    return {lines,notes,contract,periodeLabel:'Traject 6 maanden',freq:'vooraf gefactureerd, betaling binnen 14 dagen',maand:CREATOR.partner.prijs};
  }
  const p=P(c.pkg), kw=p.dept==='adv'&&c.afname==='kwartaal';
  if(c.vorm==='start'){
    periodeLabel='Totaal start 3 maanden';
    if(p.start){ lines.push([p.naam,`${eur(p.prijs)} x 3 maanden`,p.start]); contract=p.start; }
    else if(kw){ lines.push([`${p.naam} · per kwartaal`,'1 ronde in de startperiode',p.prijs]); contract=p.prijs; notes.push('Bij Organisch en Compleet staat het startbedrag in de PDF, bij Advertentie niet.'); }
    else { lines.push([`${p.naam} · maandelijks`,`${eur(p.prijs)} x 3 maanden`,p.prijs*3]); contract=p.prijs*3; notes.push('Bij Organisch en Compleet staat het startbedrag in de PDF, bij Advertentie niet.'); }
  } else if(c.vorm==='vervolg'){
    const n=c.vervolg; periodeLabel=`Totaal vervolg ${n} maanden`;
    if(kw){ const r=n/3; lines.push([`${p.naam} · per kwartaal`,`${eur(p.prijs)} x ${r} ronde${r>1?'s':''}`,p.prijs*r]); contract=p.prijs*r; }
    else { lines.push([p.naam,`${eur(p.prijs)} x ${n} maanden`,p.prijs*n]); contract=p.prijs*n; }
  } else {
    periodeLabel='Totaal Partnerjaar';
    const j = kw?p.jaarKw:p.jaar;
    lines.push([`${p.naam}${p.dept==='adv'?(kw?' · per kwartaal':' · maandelijks'):''}`, kw?`${eur(p.prijs)} x 4 rondes`:`${eur(p.prijs)} x 12 maanden`, j]);
    contract=j;
  }
  freq = kw ? 'vooraf per ronde, betaling binnen 14 dagen' : 'vooraf per maand, betaling binnen 14 dagen';
  return {lines,notes,contract,periodeLabel,freq,maand:p.prijs,eenheid:kw?'ronde':'maand'};
}
function extrasTotal(qty){
  let t=0; const l=[];
  EXTRAS.filter(x=>x.calc).forEach(x=>{const q=+qty[x.id]||0; if(q>0&&x.prijs>0){t+=q*x.prijs; l.push([x.naam,`${q} x ${eur(x.prijs)} per ${x.eenheid}`,q*x.prijs]);}});
  const open = EXTRAS.filter(x=>!x.calc && qty[x.id]).map(x=>[x.naam, x.prijsTxt]);
  return {t,l,open};
}

/* ---------- Vergelijken ---------- */
function cmpRows(ids){
  const ps=ids.map(P), r=(label,fn)=>({label,vals:ps.map(fn)});
  return [
    r('Investering',p=>eur(p.prijs)+(p.dept==='adv'?' p/m of ronde':' p/m')),
    r('Start 3 maanden',p=>p.start?eur(p.start):'Niet vermeld'),
    r('Organische shorts',p=>p.shorts?`${p.shorts} p/m · ${p.ritme}`:'Geen'),
    r('Advertenties',p=>p.ads?`${p.ads} video's · ${p.varianten} varianten`:'Geen'),
    r('Draaidagen',p=>p.dept==='org'?'1 per maand':p.dept==='comp'?'2 per maand':'Inbegrepen'),
    r('Publiceren',p=>D(p.dept).publiceren),
    r('Past bij een klant die',p=>D(p.dept).ideaal.toLowerCase()),
  ];
}
VIEWS.vergelijken = () => {
  const ids=S.cmp, ps=ids.map(P);
  const sel=i=>`<select data-i="${i}">${Object.values(PKG).map(p=>`<option value="${p.id}" ${ids[i]===p.id?'selected':''}>${p.naam}</option>`).join('')}</select>`;
  const [a,b]=ps, d=b.prijs-a.prijs;
  const pts=[];
  if(b.shorts!==a.shorts) pts.push(`${b.shorts>a.shorts?'+':''}${b.shorts-a.shorts} organische shorts per maand`);
  if(b.ads!==a.ads) pts.push(`${b.ads>a.ads?'+':''}${b.ads-a.ads} advertentievideo's (${b.varianten>a.varianten?'+':''}${b.varianten-a.varianten} varianten)`);
  if(a.dept!==b.dept) pts.push(`Publiceren: ${D(b.dept).publiceren.toLowerCase()}`);
  return `<div class="row" style="margin-bottom:16px;gap:10px"><h1 style="font-size:24px;margin:0">Vergelijken</h1>
    <div class="row right" style="gap:8px">${sel(0)}<span class="muted">met</span>${sel(1)}</div></div>
  <div class="grid g2">${ps.map(p=>`<div class="cmp-head" style="background:${D(p.dept).kleur}"><div class="small" style="opacity:.75">${D(p.dept).naam}${p.advies?' · ons advies':''}</div><div style="font-weight:600;font-size:16px">${p.naam}</div><div class="p">${eur(p.prijs)}<span class="small" style="opacity:.7;font-weight:400"> ${p.dept==='adv'?'p/m of per ronde':'p/m'}</span></div></div>`).join('')}</div>
  <div class="card" style="margin-top:12px;border-left:4px solid var(--navy)"><div class="eyebrow">Wat krijgt de klant extra bij ${b.naam}?</div>
    ${pts.length?pts.map(p=>`<div class="li">${ICON.y}<span>${p}</span></div>`).join(''):'<div class="muted">Geen verschil in volume.</div>'}
    <div class="li"><span class="ico q">€</span><span>Investering ${d>=0?'+':'−'}${eur(Math.abs(d))} per maand</span></div></div>
  <div class="card section" style="padding:4px 6px;overflow:auto"><table class="tbl">
    <tbody>${cmpRows(ids).map(r=>{const diff=new Set(r.vals.map(String)).size>1;return `<tr class="${diff?'diff':''}"><td class="muted" style="width:26%">${r.label}</td>${r.vals.map(v=>`<td style="width:37%"><b>${v}</b></td>`).join('')}</tr>`}).join('')}
    <tr><td colspan="3" class="sub">Werkzaamheden</td></tr>
    ${MATRIX.map(([label,m])=>{const vals=ps.map(p=>m[p.dept]);const diff=new Set(vals.map(v=>v[0])).size>1;return `<tr class="${diff?'diff':''}"><td class="muted">${label}</td>${vals.map(v=>`<td><div class="row" style="gap:8px;flex-wrap:nowrap">${ICON[v[0]]}<span class="small muted">${v[1]}</span></div></td>`).join('')}</tr>`}).join('')}
    </tbody></table></div>
  <div class="legend" style="margin-top:8px"><span><span style="display:inline-block;width:12px;height:12px;background:#fffbea;border:1px solid #f3e3a1;border-radius:3px;vertical-align:-2px"></span> Verschil</span><span>${ICON.q} Niet genoemd in de PDF</span></div>`;
};
AFTER.vergelijken = ()=>document.querySelectorAll('select[data-i]').forEach(s=>s.onchange=()=>{S.cmp[+s.dataset.i]=s.value;go()});

VIEWS.controle = () => `<button class="btn" onclick="nav('overzicht')" style="margin-bottom:14px">← Terug</button><h1 style="font-size:24px">Controlepunten</h1><p class="muted">Informatie die in de PDF ontbreekt of onduidelijk is. Niets hiervan is zelf ingevuld.</p>
  <div class="grid g2">${CONTROLE.map((c,i)=>`<div class="card" style="border-left:4px solid #f59e0b"><div class="row"><span class="check-ico">${i+1}</span><b>${c.t}</b></div><p class="muted" style="margin:8px 0 0">${c.d}</p></div>`).join('')}</div>`;

   6. ZOEKFUNCTIE

function searchIndex(){
  const idx=[];
  Object.values(PKG).forEach(p=>idx.push({t:p.naam, s:`${D(p.dept).naam} · ${volChips(p).join(' · ')}`, p:eur(p.prijs), c:D(p.dept).kleur, go:()=>{S.deptPkg[p.dept]=p.id;toDept(p.dept)}}));
  Object.values(DEPTS).forEach(d=>idx.push({t:d.naam, s:d.doel, p:'vanaf '+eur(d.vanaf), c:d.kleur, go:()=>toDept(d.key)}));
  EXTRAS.forEach(x=>idx.push({t:x.naam, s:'Extra kosten · '+x.sub, p:x.prijsTxt||eur(x.prijs), c:'#06053a', go:()=>{nav('extra');setTimeout(()=>{const e=document.getElementById('xd-'+x.id);if(e){e.classList.add('open');e.scrollIntoView({block:'center'})}},50)}}));
  FAQ.forEach((f,i)=>idx.push({t:f.q, s:'Vraag van klant', p:'', c:'#d97706', go:()=>{nav('extra');setTimeout(()=>{const e=document.querySelectorAll('.acc.faq')[i];if(e){e.classList.add('open');e.scrollIntoView({block:'center'})}},50)}}));
  idx.push({t:'Partnerjaar', s:'12 maanden vast, vaste prijs, voorrang', p:'', c:'#06053a', go:()=>{S.pTab='jaar';nav('partner')}});
  idx.push({t:'Creator Partner', s:'Begeleiding eigen creator', p:eur(CREATOR.partner.prijs), c:'#06053a', go:()=>{S.pTab='creator';nav('partner')}});
  idx.push({t:'Creator Academy', s:'Per creator, min. 6 maanden', p:eur(CREATOR.academy.prijs), c:'#06053a', go:()=>{S.pTab='creator';nav('partner')}});
  idx.push({t:'Klant adviseren', s:'Afdeling, pakket, prijs en samenvatting', p:'', c:'#06053a', go:()=>nav('adviseren')});
  return idx;
}
let IDX=null, resIdx=0, resList=[];
function doSearch(q){
  IDX = IDX||searchIndex();
  const box=$('#results');
  q=q.trim().toLowerCase();
  if(!q){box.classList.remove('show');return}
  const terms=q.split(/\s+/);
  resList = IDX.filter(it=>{const h=(it.t+' '+it.s+' '+it.p).toLowerCase();return terms.every(t=>h.includes(t))}).slice(0,12);
  resIdx=0;
  box.innerHTML = resList.length ? resList.map((r,i)=>`<div class="res ${i===0?'act':''}" data-i="${i}"><span class="dot" style="background:${r.c}"></span><div><div class="t">${esc(r.t)}</div><div class="s">${esc(r.s)}</div></div><div class="p">${r.p}</div></div>`).join('')
    : '<div class="res muted">Geen resultaten</div>';
  box.classList.add('show');
  box.querySelectorAll('.res[data-i]').forEach(el=>el.onmousedown=e=>{e.preventDefault();pick(+el.dataset.i)});
}
function pick(i){ const r=resList[i]; if(!r) return; $('#results').classList.remove('show'); $('#q').value=''; $('#q').blur(); r.go(); }
$('#q').addEventListener('input',e=>doSearch(e.target.value));
$('#q').addEventListener('blur',()=>setTimeout(()=>$('#results').classList.remove('show'),100));
$('#q').addEventListener('keydown',e=>{
  const els=[...document.querySelectorAll('.res[data-i]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); if(!els.length) return; resIdx=(resIdx+(e.key==='ArrowDown'?1:-1)+els.length)%els.length; els.forEach((el,i)=>el.classList.toggle('act',i===resIdx));}
  if(e.key==='Enter'){e.preventDefault();pick(resIdx)}
  if(e.key==='Escape'){$('#results').classList.remove('show');e.target.blur()}
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
$('#ctrlBtn').onclick=()=>nav('controle');
if(!window.SC_OWNER){ $('#ctrlBtn').style.display='none'; }

/* start */
try{const r=localStorage.getItem('sc-prijslijst-tab'); if(r&&VIEWS[r]) CUR=r;}catch(e){}
go();
